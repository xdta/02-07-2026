<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodbye</title>
    <link href="https://fonts.googleapis.com/css2?family=Gotu&display=swap" rel="stylesheet">
    <style>
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2; background-image: url('cloth-bg.jpg');
            background-size: cover; background-position: center;
        }
    
        #animatedDoily {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(3.16);
            z-index: -1; 
            height: 30vh; 
            width: auto;
            will-change: transform;
        }
    
        body {
            background-color: white; 
            color: #4b4b4b; 
            font-family: 'Gotu', sans-serif;
            letter-spacing: 0.15em; 
            display: flex; justify-content: center;
            align-items: center; min-height: 100vh; margin: 0;
            text-align: center; text-transform: uppercase;
            overflow: hidden;
        }
    
        .container { 
            /* Strict constraint: keeping it narrow so it stays in the 'hole' */
            width: 22vw; 
            max-width: 350px; 
            padding: 0; 
            opacity: 1;
            z-index: 5;
            transition: opacity 1.5s ease-out; 
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
    
        .container.hidden { opacity: 0; pointer-events: none; }
    
        .message-text {
            /* Reduced from 0.65vw to 0.5vw for that 75%-zoom look at 100% scale */
            font-size: 0.65vw; 
            line-height: 1.8;
            margin-bottom: 1vw;
            text-transform: none; 
            font-weight: 300;
            opacity: 0.7; 
            width: 100%;
        }
    
        .input-group { 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            width: 100%;
        }
        
        input { 
            border: none; background: transparent; 
            /* Wider dash styling */
            background-image: linear-gradient(to right, #4b4b4b 60%, rgba(255,255,255,0) 0%); 
            background-position: bottom; 
            background-size: 0.6vw 1px; 
            background-repeat: repeat-x; 
            font-family: 'Gotu', sans-serif; 
            font-size: 0.65vw; 
            outline: none; 
            width: 100%; 
            max-width: 8vw; 
            padding: 0.2vw 0; 
            color: #4b4b4b; 
            text-align: center;
            opacity: 0.8;
        }
    
        .submit-btn {
            cursor: pointer;
            font-size: 0.5vw; 
            letter-spacing: 0.4vw;
            text-decoration: none;
            color: #4b4b4b;
            background: none;
            border: none;
            font-family: 'Gotu', sans-serif;
            text-transform: uppercase;
            margin-top: 0.6vw; 
            transition: opacity 0.3s;
            opacity: 0.5;
        }
    
        .submit-btn:hover { opacity: 1; }
    
        #errorMessage {
            color: #942536;
            font-size: 0.4vw;
            margin-top: 0.4vw;
            display: none;
            text-transform: none;
        }
    
        /* Mobile: Kept as-is since you mentioned it looks okay */
        @media screen and (max-width: 800px) {
            .container { width: 85vw; max-width: 85vw; }
            .message-text { font-size: 0.9rem; line-height: 1.5; }
            input { font-size: 1.1rem; max-width: 180px; background-size: 15px 1px; }
            .submit-btn { font-size: 0.7rem; margin-top: 15px; }
        }
    </style>
</head>
<body>

    <img src="doily_6.png" id="animatedDoily" alt="Doily">

    <div class="container" id="mainContent">
        <div class="message-text">
            To say goodbye, please send us one word<br>
            Perhaps a name that was on your mind that Day <br>
            or Today <br>
            or perhaps not⋆˙⟡
        </div>

        <div class="input-group">
            <input type="text" id="farewellWord" spellcheck="false" autocomplete="off">
            <div id="errorMessage">Please leave a word.</div>
            <button class="submit-btn" id="submitBtn">Submit</button>
        </div>
    </div>

    <script>
        const startTime = Date.now(); 
        const doilyImg = document.getElementById('animatedDoily');
        const content = document.getElementById('mainContent');
        const submitBtn = document.getElementById('submitBtn');
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxM3PZNNVc9kaYFS4i4jzngqZ-sPQOIF2-an-Vx9M1_HKl8U_Ch59xSet_4RDg992BZTg/exec';

        for (let i = 1; i <= 6; i++) {
            new Image().src = `doily_${i}.png`;
        }

        submitBtn.addEventListener('click', function() {
            const wordValue = document.getElementById('farewellWord').value;
            const error = document.getElementById('errorMessage');

            if (!wordValue.trim()) {
                error.style.display = 'block';
                return;
            }
            error.style.display = 'none';

            const duration = ((Date.now() - startTime) / 1000).toFixed(3) + "s";

            content.classList.add('hidden');
            runReverseAnimation();

            fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: new URLSearchParams({ 
                    'farewell_word': wordValue,
                    'duration': duration 
                }) 
            }).catch(err => console.error(err));
        });

        function runReverseAnimation() {
            let frame = 6;
            const totalFrames = 6;
            const intervalTime = 2500 / totalFrames; 

            const reverseAnimation = setInterval(() => {
                frame--;
                const scaleValue = 1 + ((frame - 1) * (2.16 / (totalFrames - 1)));
                doilyImg.style.transform = `translate(-50%, -50%) scale(${scaleValue})`;
                
                if (frame >= 1) {
                    doilyImg.src = `doily_${frame}.png`;
                }

                if (frame === 1) {
                    clearInterval(reverseAnimation);
                }
            }, intervalTime);
        }
    </script>
</body>
</html>
